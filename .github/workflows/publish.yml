name: Publish to npm
permissions:
  contents: read
  id-token: write
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "${RELEASE_TAG#v}" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Upgrade npm (OIDC trusted publishing requires >= 11.5.1)
        run: npm install -g npm@^11.5.1
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint:check
      - name: Check code formatting
        run: npm run format:check
      - name: Run tests
        run: npm test
      - name: Build the project
        run: npm run build
      - name: Check bundle size
        run: npm run test:bundle
      - name: Check if version already published
        id: version-check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME is already published on npm"
            echo "already-published=true" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME is not published yet"
            echo "already-published=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish to npm
        if: steps.version-check.outputs.already-published == 'false'
        run: npm publish --access public
